# Forgejo on Dell: the source of truth for code, tasks, milestones and
# releases. Rules: AGENTS.md sections 2, 8 and 9. Reached from Dell only.
name: sutradhar-forgejo

services:
  forgejo:
    # Forgejo 15.0.11 (long-term support), rootless, pinned by digest.
    image: "codeberg.org/forgejo/forgejo:15.0.11-rootless@\
      sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c"
    container_name: sutradhar-forgejo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - runner-jobs
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
      # The door's socket folder on Dell. Set SUTRADHAR_DOOR_DIR in the
      # private file docker/forgejo/.env, which is never committed.
      - ${SUTRADHAR_DOOR_DIR:?see docker/forgejo/.env}:/door
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__log__MODE: console
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__LFS_START_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # The owner chose to let the old work list be read without signing in.
      # This repository is private, so reading it always needs sign-in.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__repository__DISABLE_HTTP_GIT: "false"
      FORGEJO__repository__FORCE_PRIVATE: "false"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__DEFAULT_BRANCH: main
      # Code, tasks, projects, releases and Actions. No pull requests:
      # all work is on main (trunk-based development).
      FORGEJO__repository__DEFAULT_REPO_UNITS: "repo.code,repo.issues,\
        repo.projects,repo.releases,repo.actions"
      FORGEJO__repository__DISABLED_REPO_UNITS: "repo.pulls,repo.wiki,\
        repo.ext_issues,repo.ext_wiki,repo.packages"
      FORGEJO__repository_0X2E_upload__ENABLED: "false"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: self
      FORGEJO__mirror__ENABLED: "false"
      FORGEJO__federation__ENABLED: "false"
      FORGEJO__cron_0X2E_update_checker__ENABLED: "false"

networks:
  default:
  # Runner jobs join only this network (docs/specs/0060-runner.md). It
  # has no way out, so a job reaches Forgejo and nothing else.
  runner-jobs:
    internal: true

volumes:
  forgejo-data:
  forgejo-config:
