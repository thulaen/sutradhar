# The spelling check's settings (typos; gate check text.typos). Prose is
# British English (AGENTS.md section 1). The patterns below are fixed
# names from other projects and standards, and deliberate misspellings
# in tests; they are allowed exactly as written, never as prose.

[default]
locale = "en-gb"
extend-ignore-re = [
    "Authorization:",
    "NO_COLOR",
    "--no-color",
    "oauth/authorize",
    "authorize_url",
    "\\bCENTER\\b",
    "\\bCOLOR\\b",
    "authorization_code",
    "Merchant Center",
    "AppArmor",
    "Canva",
    "Organization data",
    "serde::Serialize",
    "unicode-normalization",
    "linking\\.thred",
    "[Rr]aspbery",
    "caf\\\\xe9",
    "\\bAX\\b",
    "\\bAX-?[0-9]+",
    "-CATALOG\\b",
    "quint-modeling",
    "ai_optimization",
    "audit_artifact",
    "artifact_id",
    "schema\\.org `Organization`",
    "Person or Organization",
    "Organization guidance",
    "\\[organization\\]",
    "find_by_statu_and_created_after",
    "field `statu`",
    "Proxy-Authorization",
    "authorization, cookie",
    "\\bSlite\\b",
    "\\bCANVA\\b",
    "Dueling bandit",
]

[files]
# vocabulary.md is a list of Hindi words in Latin letters, not English.
extend-exclude = [
    "target",
    "Cargo.lock",
    "LICENSE",
    "LICENSES",
    "docs/standards/vocabulary.md",
]
