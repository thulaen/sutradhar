[[finding]]
what = "Later: SUT-503 with lowest-rank ties (0067:192-195, 0055:137) gives a correlation that differs from average-rank Spearman and is undefined for all-tied or one-item batches, and a reversed order (Spearman -1) is never flagged; these join the recorded small-batch, all-tied and reversed-order items."
fixed = true

[[finding]]
what = "Later: shape usefulness is judged for the shape as a whole (0067:96-98), so a slot of many weak but distinct steps counts every passing chain; a per-chain usefulness floor or a reviewer note per slot is later work."
