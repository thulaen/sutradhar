summary = "Read the task, its comments, the seven-file diff and the door and push-tier code around it. Checked that the red copy equals a875bc2 plus the diff. This session had no tool for starting helpers, so I ran the attacks myself as five attackers, each written as a real test in a private copy (crates/aegis-door/tests/redprobe.rs, not part of the change). The attacks: (1) crafted parent order, where the first-parent line skips accepted main and ends at one of its ancestors; (2) octopus merges in both parent orders, with code only in the merge tree; (3) orphan roots, both first on the line and as a later parent; (4) legitimate pushes the rule must still allow: an unchanged push, a side branch cut from an older main and merged with main first, an annotated tag named as the new main, and Forgejo's main lost behind refs/door/main; (5) a crafted merge deep inside the push. Every bad push came back door.history, or commit.tdd for code hidden in a docs-only merge, and accepted main stayed where it was. Every legitimate push passed. Four of the probes and both new tests (tiers::push_tier_scans_changes_made_in_merges, rules::accepted_main_must_stay_the_first_parent) fail with the parent's gate.rs and history.rs and pass on the candidate. aegis and aegis-door: 303 passed, 0 failed, 0 ignored (298 plus 5 probes), sealed in the queue. I also checked replace objects and grafts: git_env already shuts them off, and a push cannot create refs. The ids passed to git are checked hex ids, so none can look like an option. The missing 0001-door.md paragraph leaves the spec incomplete, not untrue: its ancestor rule still holds. Nothing blocking."

