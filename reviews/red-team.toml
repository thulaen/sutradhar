summary = "Round 11 red team of the staged chains change (AGENTS.md section 3, specs 0055, 0064, 0067, specs README). Three red agents ran: break it (empty, one-item and tied batches, reversals, band counts, rank-order form, repeated steps, other output kinds), get round it (padding by noise slots with no base shape, reorders with an extra step, per-batch perturbation, probe-keyed steps) and abuse it (probe set versions, seed lists, signers, identity forms, forged or swapped lists). I checked each report against the staged text. The round 11 fixes hold: the tie check works on the rank order's form alone and pins the largest rank to n - k + 1, each step's seed comes from a probe set that 0055 guarantees exists for its kinds, and signers are kept apart from authors. No agent found a contradiction with 0055 or 0064 on identity, stages, evidence groups or scope rows. What remains is later work already recorded or noted below."

[[finding]]
what = "Later: 0067-method-chains.md:98-102 places 'Every signature on a shape, on its reviews and on its S- scope row' under the verified bullet, so it could be read as limited to that stage or as covering the owner's spec_approved signature; say once, outside the stage list, which signatures it covers."
fixed = true

[[finding]]
