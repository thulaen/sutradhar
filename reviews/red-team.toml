[[finding]]
what = "Later: 0067-method-chains.md:124-125 records each probe set version a chain draws seeds from but does not say it must equal the version at the release candidate that the step's own evidence names (0055:253); within one run this follows from condition 1, so state it."
fixed = true

[[finding]]
what = "Later: 0067-method-chains.md:198-205 claims a shape adding near-identity or small-noise slots gains nothing, but only against admitted shapes; shapes [A,N1,C], [A,C,N2], [N3,A,C] with no admitted [A,C] are two positions apart from each other and never paired. Same family as the recorded 'chains two or more steps apart' item; narrow the claim or add a step-removal pairing."
