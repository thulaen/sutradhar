summary = "Three red agents attacked crates/sutradhar-tijori/src/policy.rs against spec 0065 Checking signatures item 3: break it (empty, cut-short, u64::MAX versions and length prefixes, weak keys), get round it (non-canonical S, purpose prefix confusion such as policy-change-x, rollback, same-version byte swap, cross-purpose signature reuse) and abuse it (eleven code mutations, every one caught by the tests). No unsigned, rolled-back or swapped policy was accepted; the check order matches the spec."

[[finding]]
what = "Later: accept takes any newer owner-signed version without checking the previous-policy digest the spec requires (spec 0065 test list: N+2 built on a held-back N+1 must be refused); Policy has no field for it. Already a Later item on #167; the accept doc could name it so callers do not think rollback is fully handled."
fixed = true

[[finding]]
what = "Later: at the same version with a matching digest, accept returns Ok without checking the signature (an all-zero signature passes). Safe while the record digest only comes from a signature-checked accept; if an owner reset ever writes a digest, the per-load owner-signature re-check (Later on #167) must cover it. A one-line doc note on accept would make it explicit."
fixed = true

