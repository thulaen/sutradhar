summary = "The change adds slice six of the agent harness: fetching the named commit from an agent's clone into the harness's own repository (git_fetch). The clone path must be a plain absolute folder with no link in it, a repository of its own with no .git file and no borrowed objects; every object is checked in full as it comes in; each agent has its own ref namespace; the commit must be on a branch the clone offers; the repository size is capped; and a refused fetch is discarded and its objects collected. A tidy call removes objects no ref holds. The fetch was also run for real from an agent account's clone as the harness account. The slice stays within step 1 of the Push section; the push, the log file, the socket and the service remain in the catalogue row. One review round found medium points (one shared ref namespace and prune across agents, a refused fetch leaving objects behind, no check for links, .git files or alternates in the clone, no safe-directory setting); all were fixed after that read, each with a test, and each new guard was removed in turn to see its test fail. All 97 tests pass and clippy is clean."

[[finding]]
what = "Medium findings: a shared ref namespace, a refused fetch leaving objects behind, no check for links, git files or alternates, and no safe-directory setting. All fixed with tests."
