summary = "Read the staged policy.rs, its tests, lib.rs, Cargo.toml, Cargo.lock and SBOM changes against spec 0065 'Checking signatures' items 2 and 3. Traced the untrusted inputs (policy bytes, signature, caller-decoded instance and version, version record) to accept(): a newer version is accepted only after the policy-change purpose strip and a strict Ed25519 check with the caller's owner key; the same version only on a SHA-256 match with a record that was itself raised after a signed accept or an owner-signed reset; missing record, other instance and older version are refused before any signature work. No secrets, no file or shell use, no home-made crypto; sha2 0.11.1 is already admitted and used by aegis and tijori. Policy tests pass (10)."

[[finding]]
what = "Later: crates/sutradhar-tijori/src/policy.rs:62 - accept() trusts the caller-decoded instance and version; a caller that takes them from outside the signed bytes could pass a relabelled policy (another instance's, or a replayed one under a higher version). Contract is documented and pinned by a test; move the decoding into accept() once spec 0065 sets the policy byte encoding (already a Later item on #167)."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/policy.rs:184 - PolicyTrust::new takes any digest and registry, so nothing ties it to a policy that accept() passed. When the tijori trust source is built, construct PolicyTrust only from an accepted policy (already a Later item on #167)."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/policy.rs:154 - the same-version path answers from the digest match alone, without re-checking the owner signature. Safe only while the version record has its one writer (tijori, after a signed accept or an owner-signed reset) and is protected from other writers; the record writer and reset piece must keep that, or the load path should re-check the signature (already a Later item on #167)."
fixed = true
