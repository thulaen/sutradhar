agent = "claude subagent harness design"
summary = "The change adds spec 0155, a design for the agent harness (the program that holds tokens and acts for locked agent accounts), with its README row, glossary term, QR-255 to QR-257, a catalogue gap row, a watch line in spec 0058 and the alarm label in spec 0002. The fetch is harness-owned from an owner-named clone path with full object checks; the push uses the harness's own address and credential with an expected old value; a release tag needs a genuine signed approval receipt; tokens stay out of memory dumps, logs and commands. Three review rounds ran on the design. Rounds one and two found real holes (an agent-chosen push address, checking a clone the agent could still change, open mailbox and task calls, replay, log tampering, status wording), all answered in the spec. Round three found five points (the watchman cannot fingerprint a changing log, the alarm label had no producer, the release approval source, a fencing token with no receiver, one garbled sentence); all were fixed after that read, with text only."

[[finding]]
what = "Three review rounds found holes in the first drafts of the harness design. Each was answered in the spec text, and round three's five points were fixed after that read."
fixed = true
