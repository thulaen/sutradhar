summary = "Read the whole candidate diff, task #159 and its comments. Untrusted inputs are pushed commits (ids, parent order, trees, paths, messages). Traced them: commits() now lists a merge's paths against its first parent with diff-tree -z, parsed by nul_list into the TDD check and parent_with_tests, whose link guard and new-crate check are unchanged; the door's keeps_first_parent passes only hex ids from rev-parse --verify and a base..commit range ending in --, so no argument injection; its output is bounded by the 500-commit count that runs first; every git error or root commit fails closed (Err or refusal). Checked that a merge with accepted main as a later parent is refused, that a normal --no-ff merge still passes, and that the side-branch commits stay in the scanned range. is_record only compares bytes; the test covers prefix, suffix, subfolder and empty cases. No secrets, crypto, network calls or new crates. On a copy of the candidate tree through the sealed pankti queue: aegis and aegis-door all green, 0 failed, 0 ignored. With the fix reverted, tiers::push_tier_scans_changes_made_in_merges and rules::accepted_main_must_stay_the_first_parent both fail. docs/specs/0001-door.md still says what is true: accepted main must be an ancestor. The new stricter rule is not in it yet, so the spec is incomplete but nothing in it is false."

