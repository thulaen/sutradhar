summary = "Round 2. Read the staged policy.rs, its tests, lib.rs, Cargo.toml, Cargo.lock and SBOM changes against spec 0065 'Checking signatures' items 2 and 3 and AGENTS.md sections 5, 6 and 7.3. accept is a pure function in the tijori library's one public API, reads no file and writes no record (the tijori program stays the record's one writer, every trust source only reads), refuses missing record, other instance, older version, same version with other bytes, then a newer version without a policy-change purpose or a strict owner signature, matching item 3; the same-version-same-digest path needs no signature re-check by the spec. The purpose error now carries its PurposeError like check.rs, so the error shape is consistent. sha2 is admitted in gate/packages.toml and pinned as in aegis and tijori. No globals, no hidden wiring, no unused hook. Noted for the Phase 3 move onto Boot."

[[finding]]
what = "Later: crates/sutradhar-tijori/src/policy.rs PolicyTrust::new is public and takes any digest and registry, so nothing ties a PolicyTrust to a policy that accept() passed. When the trust source and the policy encoding land, build PolicyTrust only from accepted bytes (one constructor that runs accept and decodes the registry from the same bytes). Already a Later item on #167."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/policy.rs Policy has public instance and version fields decoded by the caller beside the signed bytes, so a wrong decode accepts a relabelled policy (pinned by the a_mislabelled_policy test). Once spec 0065 sets the policy byte encoding, decode instance and version inside this module from policy.signed and drop the separate fields. Already a Later item on #167."
fixed = true
