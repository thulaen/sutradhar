summary = "The change adds the first slice of the agent harness: the crate agent-harness with a strict request parser (push, task, mailbox and status requests), the patterns for ids, commits, release tags, paths, labels, names and text, tests written first, and the lock file, SBOM and catalogue updates. The 64 KiB limit is checked before any parsing; the request is parsed twice, once to find repeated keys, and serde_json's recursion limit stops deep nesting. One review round found medium points: an incomplete mailbox list, untested limits, tag names git would refuse, blank or multi-line titles, invisible and direction-changing characters, alarm titles that could be imitated and bodies that could forge the agent mark; all were fixed after that read, each with a test, and the boundary test was made able to fail. Afterwards the gate asked for named constants, files of at most 300 lines and lines of at most 80 characters, so the parser and its tests were split into smaller files with shared test helpers, the secret-like test text was built from parts and the crate was named in the glossary; behaviour is unchanged and all 25 tests pass."

