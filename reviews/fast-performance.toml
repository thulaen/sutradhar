summary = "Round 2: read the staged policy.rs, lib.rs, tests, Cargo.toml, Cargo.lock and SBOM changes. accept runs once per policy load: one SHA-256 over the signed bytes, one short purpose String, one purpose strip and one strict verify; no loops, no file reads, no growth. The round 2 changes (PurposeError carried in NotPolicyChange, doc and test wording, new tests) add no work on any hot path. PolicyTrust answers from one in-memory HashMap with O(1) lookups. sha2 was already in the lock, so no new build cost."

[[finding]]
what = "Later: PolicyTrust::lookup (crates/sutradhar-tijori/src/policy.rs, impl Trust) clones the whole KeyEntry (principal String plus BTreeMap of purpose scope Vecs) on every check, because the existing Trust trait returns an owned Option<KeyEntry>. Cheap at today's registry size and not made worse here; if checks become per-request at volume, let Trust lend the entry (or hold entries in Arc) instead of cloning."
fixed = true

[[finding]]
what = "Later (minor): accept (crates/sutradhar-tijori/src/policy.rs) hashes policy.signed before the Older version check, so an older policy is hashed for nothing. One hash per load; moving the digest below the Older check would skip it, not needed now."
fixed = true
