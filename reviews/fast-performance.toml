summary = "Read every staged source file in sutradhar-tijori (purpose, verify, check) and tijori (log, index) again after the round 2 fixes, for per-check and per-entry work, allocations, copies and unbounded growth. The one-call Trust::lookup asks the trust source once per check, check still refuses cheap faults (policy, key, registry purpose, purpose field) before the Ed25519 check, strip borrows, Index::insert's new counter check is one compare before any work, and no call blocks or cuts text. Only small allocation costs and a later memory question remain, all already recorded as Later on #167."

[[finding]]
what = "Later: crates/tijori/src/log.rs:113-115 Entry::hash builds the whole encoding in a fresh Vec with no capacity and then hashes it, once per entry in log::check over a whole log; crates/tijori/src/index.rs:63-68 Index::insert does the same per insert, which an index rebuild repeats per signature entry. Feeding each length prefix and field straight into Sha256::update gives the same digest with no allocation (recorded on #167 as allocation-free hashing)."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/check.rs:24 and 96-106 Trust::lookup returns an owned KeyEntry (principal, the whole purposes map and every scope string) on every check, and check then clones the scopes again although it owns the entry; key.purposes.remove(purpose.as_str()) would drop the second copy. When the real policy trust source lands, a borrowing lookup lets a check copy only the one purpose's scopes (recorded on #167 as borrowing lookups)."
fixed = true

[[finding]]
what = "Later: crates/tijori/src/index.rs:28-32 Index keeps every key in an in-memory HashMap that grows with every signature for the life of the log, with no limit. When the durable index (spec 0065 'The signature log' item 3) lands in a later package of #167, decide whether the core keeps the whole index in memory and measure its size against the core's memory limit, as spec 0065 asks."
fixed = true
