summary = "Round 2. Read every staged line of sutradhar-tijori (purpose, verify, check, tests) and tijori (log, index, tests), plus ed25519-compact 2.6.0's VerifyingState path, and ran both crates' tests (all pass). Checked errors-to-defaults, overflow, check-then-use, unbounded input, trusted outside values and weakened tests. The round 1 blocker is fixed: Trust::lookup returns the digest and the key from one copy, and a reloading-trust test proves one call. The usize-to-u64 unwrap_or(u64::MAX) calls cannot fire on any target Rust supports; strip bounds the input length against the bytes held; counters use checked_add; Index::insert now refuses a counter that does not move forward; tests assert exact error values."

[[finding]]
what = "crates/sutradhar-tijori/src/check.rs: check-then-use across two Trust calls (digest checked, then key read from a possibly reloaded policy). Fixed in round 2: Trust::lookup returns both from one copy, and a_reload_during_a_check_cannot_mix_two_policies shows the check asks once."
fixed = true

[[finding]]
what = "crates/tijori/src/index.rs: Index::insert let latest go backwards. Fixed in round 2: insert refuses a counter not above latest with CounterWentBack and leaves latest and the running hash unchanged, which a test checks."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/verify.rs:57. ed25519-compact 2.6.0 uses the cofactored equation ([s]B - [h]A - R of small order) and refuses only small-order keys, not mixed-order ones. Signer-registry admission should refuse a key with a torsion part and spec 0065 should name the equation (already recorded as Later on #167)."
fixed = true

[[finding]]
what = "Later: crates/sutradhar-tijori/src/verify.rs:4-5 says a signature whose R has small order is refused. ed25519-compact does refuse it (decode_point_negated maps it to InvalidSignature), but no test in tests/verify.rs signs with a small-order R, so a library swap could drop that refusal unseen. Add a test with R set to a small-order point."
fixed = true

[[finding]]
what = "Later: crates/tijori/src/log.rs:209. Chain::append silently uses the previous time when the clock goes back, so a clock jumped far forward then corrected freezes every later entry's time with no signal to the caller. Covered by the clock-bound Later item on #167; the core should report a clock that went back."
fixed = true

[[finding]]
what = "Later: no size limit yet on Signed.bytes, Entry.body, index keys or Purpose::new's max_len (taken from the policy). The socket and policy-reading packages of #167 must cap them (already recorded as the request-size-caps Later item)."
