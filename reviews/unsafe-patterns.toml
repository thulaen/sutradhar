summary = "The change adds slice five of the agent harness: reading the commits of a push from the harness's own repository with git turned down to what cannot run anything (git_run: timeout, empty environment, no system or user config, no hooks, fsmonitor, pager, external diff, protocols, replace objects, grafts or lazy fetch, capped output, input written from its own thread) and the checks as plain data (git_read: full commit ids only, tip descends from main, a commit count cap, author, committer, parents and message from the raw commit, changed paths with both sides of a rename, only plain files, no .gitmodules, a file size cap). Tests use real temporary repositories, including repositories whose config, attributes, replace refs and missing objects try to run a program; each protection was removed to see its test fail. There is no unsafe code, arguments are passed as lists with ids checked first, and no shell is used. One review round found medium points (a possible pipe stall on a long input list, output capped only after buffering, replace refs and grafts not disabled, lazy fetch from a promisor remote not blocked); all were fixed after that read, each with a test, and a test with seven thousand files was added. All 86 tests pass and clippy is clean. After the review the gate refused copied test code, so the shared tripwire setup moved into one helper; behaviour is unchanged."

[[finding]]
what = "Medium findings: a possible pipe stall, output capped after buffering, replace refs and grafts not disabled, lazy fetch not blocked. All fixed with tests."
