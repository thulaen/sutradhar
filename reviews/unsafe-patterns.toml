summary = "The change adds a sync watch to chaukidar: each check reads both main heads, keeps a clock in STATE.sync, and raises its own alarm (SYNC_ALARM_TITLE, never copied) once when GitHub's head differs from Forgejo's or cannot be read and has not moved for 10 minutes. No unsafe code, no unwrap outside tests, saturating arithmetic, and a bad reply becomes an error, not a panic. Three review rounds ran. Round three found only low points (alarm wording when GitHub is unreadable, a second alarm when GitHub came back, a test name, one stale comment and one spec line); all were fixed after that read, with a new test for the GitHub-returns case. After that, the gate asked for a named constant for the 12-digit short id; added."

