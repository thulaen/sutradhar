what = "Later: crates/aegis-door/src/gate.rs:282, keeps_first_parent maps every failure of `rev-parse --verify -q oldest^1` to false through is_ok_and, so a real git fault is reported as a door.history refusal instead of 'cannot be checked'. It fails closed (the push is refused), so it is safe; the comment names only the root-commit case."
