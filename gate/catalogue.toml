# The gate's catalogue (AGENTS.md section 7; roadmap Phase 2 item 2).
# One entry for every check the gate can report. Each names the owner's
# gate items (docs/standards/gate-items.md) it covers in full (`items`)
# or only in part (`partly`): for some languages, or some cases. Only
# full cover counts toward the release bar. Each also names the tiers it
# runs in, and its proof: the test that plants a fault and sees it
# refused.
# The check gate.catalogue keeps this list and the code in step.

[[check]]
id = "commit.message"
partly = ["GI-17", "GI-49"]
tiers = ["commit", "push"]
proof = "aegis::commit_msg::tests::refuses_bad_subjects"

