[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
mem_forget = "deny"
large_stack_arrays = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"

[profile.release]
overflow-checks = true
