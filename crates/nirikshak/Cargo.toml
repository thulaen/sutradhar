[package]
name = "nirikshak"
version = "0.1.0"
description = "The code analyser: reads facts about the code and applies rules written in Rego."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# regorus 0.10.1 is the newest release that needs no Verus support
# library, which would bring a second copy of syn (deny.toml refuses
# that). See docs/specs/0061-nirikshak.md.
[dependencies]
proc-macro2 = { version = "1", default-features = false, features = [
    "span-locations",
] }
regorus = { version = "=0.10.1", default-features = false, features = [
    "arc",
    "graph",
] }
serde_json = "1"
yaml-rust2 = { version = "0.13.0", default-features = false }
syn = { version = "3", default-features = false, features = [
    "full",
    "parsing",
    "visit",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
