[package]
name = "aegis"
version = "0.1.0"
description = "The gate: every check Sutradhar runs at commit, push, release."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "tdd_blob_race"
harness = false

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dependencies]
nirikshak = { path = "../nirikshak" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
